<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />

    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="main.js" defer></script>

    <title>Sistema Escolar</title>
</head>
<body>

    <div class="tabs-container">
        <button class="tab-button active" id="btn-cadastrar-turma"
            onclick="Interface.cadastrarTurma()">Cadastrar Turma</button>

        <button class="tab-button" id="btn-cadastrar"
            onclick="Interface.cadastrar()">Cadastrar Aluno</button>

        <button class="tab-button" id="btn-listar"
            onclick="listarAluno()">Listar Alunos</button>
    </div>

    <div id="tab-cadastrar-turma" class="tab-content active">
        <h3>Cadastrar Turma</h3>

        Curso:
        <input id="curso" type="text" />

        Professor:
        <input id="prof" type="text" />

        <button onclick="btnSalvarTurma()" class="btn-salvar">
            Salvar Turma
        </button>
    </div>

    <div id="tab-cadastrar" class="tab-content">
        <h3>Cadastrar Aluno</h3>

        Turma:
        <select id="turma-selecionada" onchange="selecionarTurma()">
            <option value="">Selecione uma turma</option>
        </select>

        Nome:
        <input id="nome" type="text" />

        Nota 1:
        <input id="n1" type="number" />

        Nota 2:
        <input id="n2" type="number" />

        Nota 3:
        <input id="n3" type="number" />

        <button onclick="btnSalvarAluno()" class="btn-salvar">
            Salvar Aluno
        </button>
    </div>

    <div id="tab-listar" class="tab-content">
        <h3>Alunos Cadastrados</h3>

        <div class="lista-alunos" id="alunos">
            Nenhum aluno cadastrado ainda.
        </div>
    </div>

</body>
</html>
